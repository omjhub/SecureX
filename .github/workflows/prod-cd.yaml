name: Production CD Pipeline

# Promotes the exact image that passed QA. The QA tag is read from
# k8-manifests/qa/app-deployment.yaml on main, so whatever was tested in QA
# and merged is what production runs. Nothing is rebuilt and ":latest" is never used.
on:
  push:
    branches:
      - main
    paths:
      - k8-manifests/qa/app-deployment.yaml
      - k8-manifests/prod/**
      - .github/workflows/prod-cd.yaml
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: prod-deploy
  cancel-in-progress: false

env:
  IMAGE_REPO: omajuwa/nodejs-app

jobs:
  promote-image-to-prod:
    name: Promote tested QA image to prod tag
    runs-on: ubuntu-latest
    outputs:
      qa_sha: ${{ steps.qa.outputs.qa_sha }}
      prod_tag: ${{ steps.qa.outputs.prod_tag }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Read the image tag QA tested
        id: qa
        run: |
          QA_SHA=$(grep -oE "image: ${IMAGE_REPO}:[0-9a-f]{40}" k8-manifests/qa/app-deployment.yaml | head -n1 | cut -d: -f3)
          if [ -z "${QA_SHA}" ]; then
            echo "Could not find a 40 character commit SHA tag in k8-manifests/qa/app-deployment.yaml" >&2
            exit 1
          fi
          echo "qa_sha=${QA_SHA}" >> "$GITHUB_OUTPUT"
          echo "prod_tag=prod-${QA_SHA}" >> "$GITHUB_OUTPUT"
          echo "Promoting ${IMAGE_REPO}:${QA_SHA} to ${IMAGE_REPO}:prod-${QA_SHA}"

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Retag the QA image without rebuilding
        run: |
          docker buildx imagetools create \
            --tag "${IMAGE_REPO}:${{ steps.qa.outputs.prod_tag }}" \
            "${IMAGE_REPO}:${{ steps.qa.outputs.qa_sha }}"
          docker buildx imagetools inspect "${IMAGE_REPO}:${{ steps.qa.outputs.prod_tag }}"

  deploy-to-k8s:
    name: Deploy to Production Kubernetes
    needs: promote-image-to-prod
    runs-on: ubuntu-latest
    env:
      AWS_REGION: eu-north-1
      EKS_CLUSTER_NAME: securex-cluster
      K8S_NAMESPACE: prod
      PROD_TAG: ${{ needs.promote-image-to-prod.outputs.prod_tag }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Set the promoted image in the prod manifest (runner copy only)
        run: |
          sed -i "s|image: ${IMAGE_REPO}:.*|image: ${IMAGE_REPO}:${PROD_TAG}|" k8-manifests/prod/app-deployment.yaml
          grep "image:" k8-manifests/prod/app-deployment.yaml

      - name: Configure AWS credentials from GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME_PROD }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Generate kubeconfig for EKS
        run: aws eks update-kubeconfig --region "${AWS_REGION}" --name "${EKS_CLUSTER_NAME}"

      - name: Verify identity and access
        run: |
          aws sts get-caller-identity
          kubectl auth can-i create deployments -n "${K8S_NAMESPACE}"
          kubectl auth can-i create statefulsets.apps -n "${K8S_NAMESPACE}"
          kubectl auth can-i create ingresses.networking.k8s.io -n "${K8S_NAMESPACE}"

      - name: Check prerequisites exist in prod
        run: |
          kubectl get secret regcred -n "${K8S_NAMESPACE}"
          kubectl get secret mysql-secret -n "${K8S_NAMESPACE}"

      - name: Deploy prod manifests
        run: kubectl apply -f k8-manifests/prod/ -n "${K8S_NAMESPACE}"

      - name: Verify rollout
        run: |
          kubectl rollout status statefulset/mysql -n "${K8S_NAMESPACE}" --timeout=300s
          kubectl rollout status deployment/nodejs-app -n "${K8S_NAMESPACE}" --timeout=180s

      - name: Record what is live
        run: |
          LIVE=$(kubectl get deployment nodejs-app -n "${K8S_NAMESPACE}" -o jsonpath='{.spec.template.spec.containers[0].image}')
          {
            echo "### Production deployment"
            echo "- Live image: \`${LIVE}\`"
            echo "- Source commit tested in QA: \`${{ needs.promote-image-to-prod.outputs.qa_sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
