name: Enterprise DevSecOps CICD Pipeline
on:
  push:
    branches:
      - qa
    paths:
      - client/**
      - server/**
      - k8-manifests/qa/**
      - Dockerfile
      - .checkov.yaml
      - sonar-project.properties
      - .github/workflows/qa-cicd.yml
  # Run the scans and tests on pull requests too, so problems are caught before a merge.
  # Deploy steps below only run on a push to qa.
  pull_request:
    branches:
      - qa
      - main

permissions:
  contents: write
  id-token: write

jobs:
  gitleaks-scan:
    name: Gitleak Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks Scan (fails on any secret)
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/repo" \
            zricethezav/gitleaks:v8.29.1 detect \
            --source=/repo \
            --report-format=json \
            --report-path=/repo/gitleaks-report.json \
            --redact \
            --exit-code 1

      - name: Upload Gitleaks report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleak-report
          path: gitleaks-report.json
          if-no-files-found: warn


  checkov-terraform:
    name: Checkov Terraform Scan
    runs-on: ubuntu-latest
    needs: gitleaks-scan
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Checkov
        run: pip install checkov==3.2.334

      - name: Run Checkov Terraform scan (fails on findings)
        run: |
          checkov -d . \
            --framework terraform \
            --output json > checkov-terraform-report.json

      - name: Upload Checkov Terraform report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkov-terraform-report
          path: checkov-terraform-report.json
          if-no-files-found: warn

  checkov-k8s:
    name: Checkov Kubernetes Scan
    runs-on: ubuntu-latest
    needs: gitleaks-scan
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Checkov
        run: pip install checkov==3.2.334

      - name: Run Checkov Kubernetes scan (fails on findings)
        run: |
          checkov -d . \
            --framework kubernetes \
            --output json > checkov-k8s-report.json

      - name: Upload Checkov Kubernetes report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkov-k8s-report
          path: checkov-k8s-report.json
          if-no-files-found: warn


  checkov-dockerfile:
    name: Checkov Dockerfile Scan
    runs-on: ubuntu-latest
    needs: gitleaks-scan
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Checkov
        run: pip install checkov==3.2.334

      - name: Run Checkov Dockerfile scan (fails on findings)
        run: |
          checkov -d . \
            --framework dockerfile \
            --output json > checkov-dockerfile-report.json

      - name: Upload Checkov Dockerfile report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkov-dockerfile-report
          path: checkov-dockerfile-report.json
          if-no-files-found: warn


  client-trivy-fs:
    name: Client Trivy FS Scan
    runs-on: ubuntu-latest
    needs: gitleaks-scan
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@v0.2.6
        with:
          version: v0.75.0
          cache: true

      - name: Trivy FS report on client (JSON and table)
        run: |
          trivy fs ./client --format json --output client-trivy-fs-report.json \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 0
          trivy fs ./client --format table --output client-trivy-fs-report.txt \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 0

      - name: Upload Client Trivy reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: client-trivy-fs-reports
          path: |
            client-trivy-fs-report.json
            client-trivy-fs-report.txt
          if-no-files-found: warn

      - name: Fail on fixable HIGH or CRITICAL vulnerabilities
        run: trivy fs ./client --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1

  server-trivy-fs:
    name: Server Trivy FS Scan
    runs-on: ubuntu-latest
    needs: gitleaks-scan
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@v0.2.6
        with:
          version: v0.75.0
          cache: true

      - name: Trivy FS report on server (JSON and table)
        run: |
          trivy fs ./server --format json --output server-trivy-fs-report.json \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 0
          trivy fs ./server --format table --output server-trivy-fs-report.txt \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 0

      - name: Upload Server Trivy reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-trivy-fs-reports
          path: |
            server-trivy-fs-report.json
            server-trivy-fs-report.txt
          if-no-files-found: warn

      - name: Fail on fixable HIGH or CRITICAL vulnerabilities
        run: trivy fs ./server --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1


  client-lint:
    name: Client Lint
    runs-on: ubuntu-latest
    needs:
      - client-trivy-fs
      - checkov-k8s
      - checkov-dockerfile
      - checkov-terraform
    defaults:
      run:
        working-directory: client
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install client dependencies
        run: npm ci

      - name: Run client lint
        run: npm run lint

  server-lint:
    name: Server Lint
    runs-on: ubuntu-latest
    needs:
      - server-trivy-fs
      - checkov-k8s
      - checkov-dockerfile
      - checkov-terraform
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install server dependencies
        run: npm ci

      - name: Run server lint
        run: npm run lint


  server-test:
    name: Server Test
    runs-on: ubuntu-latest
    needs: server-lint
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install server dependencies
        run: npm ci

      - name: Run server tests with coverage
        run: npm test

      - name: Upload coverage for SonarQube
        uses: actions/upload-artifact@v4
        with:
          name: server-coverage
          path: server/coverage/lcov.info
          if-no-files-found: error

  sonarqube:
    name: SonarQube Analysis & Quality Gate Check
    runs-on: ubuntu-latest
    needs:
      - server-test
      - client-lint
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download coverage report
        uses: actions/download-artifact@v4
        with:
          name: server-coverage
          path: server/coverage

      - name: SonarQube Scan
        uses: sonarsource/sonarqube-scan-action@v8.4.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      - name: SonarQube Quality Gate check (fails the pipeline if the gate fails)
        id: sonarqube-quality-gate-check
        uses: sonarsource/sonarqube-quality-gate-action@v1.2.0
        with:
          pollingTimeoutSec: 600
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}


  client-build:
    name: Client Build
    runs-on: ubuntu-latest
    needs: client-lint
    defaults:
      run:
        working-directory: client
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install client dependencies
        run: npm ci

      - name: Build client
        run: npm run build


  docker:
    name: Docker Build & Push
    needs:
      - client-build
      - sonarqube
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: |
            omajuwa/nodejs-app:${{ github.sha }}
            omajuwa/nodejs-app:latest

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@v0.2.6
        with:
          version: v0.75.0
          cache: true

      - name: Trivy image report (JSON and table)
        run: |
          trivy image omajuwa/nodejs-app:${{ github.sha }} --format json --output image-trivy-report.json \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 0
          trivy image omajuwa/nodejs-app:${{ github.sha }} --format table --output image-trivy-report.txt \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 0

      - name: Upload Trivy image reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: image-trivy-reports
          path: |
            image-trivy-report.json
            image-trivy-report.txt
          if-no-files-found: warn

      - name: Generate source SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: source-sbom.spdx.json
          upload-artifact: true

      - name: Generate image SBOM
        uses: anchore/sbom-action@v0
        with:
          image: omajuwa/nodejs-app:${{ github.sha }}
          format: spdx-json
          output-file: image-sbom.spdx.json
          upload-artifact: true

      - name: Fail on fixable HIGH or CRITICAL image vulnerabilities
        run: |
          trivy image omajuwa/nodejs-app:${{ github.sha }} \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1

      - name: Push
        if: github.event_name == 'push'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            omajuwa/nodejs-app:${{ github.sha }}
            omajuwa/nodejs-app:latest


  update-qa-manifest:
    name: Update QA Manifest
    if: github.event_name == 'push'
    needs: docker
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout qa branch
        uses: actions/checkout@v4
        with:
          ref: qa
      - name: Update image tag in manifest
        run: |
          sed -i "s|image: omajuwa/nodejs-app:.*|image: omajuwa/nodejs-app:${GITHUB_SHA}|g" k8-manifests/qa/app-deployment.yaml
      - name: Show updated manifest (debug)
        run: |
          grep "image:" k8-manifests/qa/app-deployment.yaml
      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add k8-manifests/qa/app-deployment.yaml
          git commit -m "Update QA image to ${GITHUB_SHA}" || echo "No changes to commit"
          git push origin qa


  deploy-to-k8s:
    name: Deploy to Kubernetes
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: update-qa-manifest
    env:
      AWS_REGION: eu-north-1
      EKS_CLUSTER_NAME: securex-cluster
      K8S_NAMESPACE: qa

    steps:
      - name: Checkout latest code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: qa   # pull the latest qa, including the manifest commit above

      - name: Configure AWS credentials from GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Generate kubeconfig for EKS
        run: aws eks update-kubeconfig --region "${AWS_REGION}" --name "${EKS_CLUSTER_NAME}"

      - name: Verify identity
        run: |
          aws sts get-caller-identity
          kubectl config current-context

      - name: Verify namespace access
        run: |
          kubectl get pods -n "${K8S_NAMESPACE}"
          kubectl get services -n "${K8S_NAMESPACE}"
          kubectl auth can-i create deployments -n "${K8S_NAMESPACE}"
          kubectl auth can-i create services -n "${K8S_NAMESPACE}"
          kubectl auth can-i create ingresses.networking.k8s.io -n "${K8S_NAMESPACE}"

      - name: Deploy manifests
        run: |
          kubectl apply -f k8-manifests/qa/ -n "${K8S_NAMESPACE}"

      - name: Verify rollout
        run: |
          kubectl rollout status statefulset/mysql -n "${K8S_NAMESPACE}" --timeout=300s
          kubectl rollout status deployment/nodejs-app -n "${K8S_NAMESPACE}" --timeout=180s
