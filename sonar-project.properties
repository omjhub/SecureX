sonar.projectKey=SecureX
sonar.projectName=SecureX
sonar.projectVersion=1.0

# Application code only
sonar.sources=client/src,server
sonar.exclusions=**/node_modules/**,**/coverage/**,server/__tests__/**,client/public/**,**/eslint.config.js

# Tests and coverage (coverage is produced by the Server Test job)
sonar.tests=server/__tests__
sonar.test.inclusions=server/__tests__/**/*.test.js
sonar.javascript.lcov.reportPaths=server/coverage/lcov.info
sonar.sourceEncoding=UTF-8
